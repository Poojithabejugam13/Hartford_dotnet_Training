<div class="p-5 bg-white rounded-xl shadow-md w-80">

  <p class="text-lg font-semibold text-gray-800 mb-1">
    Rate the product
  </p>

  <p class="text-sm text-gray-600 mb-4">
    {{ product.name }}
  </p>

  <div class="flex space-x-2">
    <ng-container *ngFor="let star of [1,2,3,4,5]">
      <button
        (click)="selectRating(star)"
        class="text-3xl transition"
        [ngClass]="
          star <= selectedRating
            ? 'text-yellow-400'
            : 'text-gray-300 hover:text-yellow-300'
        ">
        ★
      </button>
    </ng-container>
  </div>

  <p *ngIf="selectedRating > 0"
     class="mt-3 text-sm font-medium text-green-600">
    Child rated: {{ selectedRating }} / 5
  </p>

</div>
