<h2 class="text-2xl font-bold mb-4">My Basic CRUD Operations</h2>

<!-- FORM -->
<div class="border border-gray-300 p-4 w-72 rounded-md mb-6">
  <label class="block mb-1 font-medium">Name:</label>
  <input
    type="text"
    [(ngModel)]="user.name"
    class="w-full border border-gray-300 rounded px-2 py-1 mb-4"
  />

  <label class="block mb-1 font-medium">Email:</label>
  <input
    type="email"
    [(ngModel)]="user.email"
    class="w-full border border-gray-300 rounded px-2 py-1 mb-4"
  />

  <button
    (click)="saveUser()"
    class="w-full bg-blue-500 text-white py-1 rounded hover:bg-blue-600"
  >
    {{ isEditMode ? 'Update' : 'Add' }} User
  </button>
</div>

<hr class="mb-6" />

<!-- LIST -->
<table class="border border-gray-300 w-full max-w-xl">
  <thead class="bg-gray-100">
    <tr>
      <th class="border border-gray-300 px-3 py-2 text-left">Name</th>
      <th class="border border-gray-300 px-3 py-2 text-left">Email</th>
      <th class="border border-gray-300 px-3 py-2 text-left">Actions</th>
    </tr>
  </thead>

  <tbody>
    @for (u of users; track $index) {
      <tr class="hover:bg-gray-50">
        <td class="border border-gray-300 px-3 py-2">
          {{ u.name }}
        </td>
        <td class="border border-gray-300 px-3 py-2">
          {{ u.email }}
        </td>
        <td class="border border-gray-300 px-3 py-2 space-x-2">
          <button
            (click)="editUser(u)"
            class="bg-yellow-400 text-white px-2 py-1 rounded hover:bg-yellow-500"
          >
            Edit
          </button>

          <button
            (click)="deleteUser(u.id)"
            class="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600"
          >
            Delete
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>
