<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-6 rounded-xl shadow-lg w-96">

    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
      Message Service Demo
    </h2>

    <input
      type="text"
      [(ngModel)]="message"
      placeholder="Enter message"
      class="w-full px-4 py-2 mb-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    />

    <button
      (click)="addMessage()"
      class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-lg font-semibold mb-4"
    >
      Add Message
    </button>

    <ul class="space-y-2">
      <li
        *ngFor="let msg of messages"
        class="bg-gray-100 px-3 py-2 rounded-md text-gray-700"
      >
        {{ msg }}
      </li>
    </ul>

  </div>
</div>
