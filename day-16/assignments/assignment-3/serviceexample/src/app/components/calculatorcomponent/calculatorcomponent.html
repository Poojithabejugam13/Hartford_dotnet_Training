<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-96">
    
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">
      Calculator Using ngOnInit
    </h2>

    <input
      type="number"
      [(ngModel)]="num1"
      placeholder="Enter number 1"
      class="w-full p-3 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    >

    <input
      type="number"
      [(ngModel)]="num2"
      placeholder="Enter number 2"
      class="w-full p-3 mb-6 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    >

    <div class="grid grid-cols-2 gap-4 mb-6">
      <button
        (click)="add()"
        class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-lg"
      >
        Add
      </button>

      <button
        (click)="subtract()"
        class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 rounded-lg"
      >
        Subtract
      </button>

      <button
        (click)="multiply()"
        class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 rounded-lg"
      >
        Multiply
      </button>

      <button
        (click)="divide()"
        class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 rounded-lg"
      >
        Divide
      </button>
    </div>

    <h3 class="text-xl font-semibold text-center text-gray-700">
      Result: <span class="text-blue-600">{{ result }}</span>
    </h3>

  </div>
</div>
